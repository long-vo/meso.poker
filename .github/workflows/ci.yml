name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Run the tasks rather than spelling the commands out again: deno.json is
      # the single source of truth for flags and file lists, and the pre-commit
      # hook runs the same four, so the two cannot drift apart.
      - name: Format check
        run: deno task fmt --check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test
